# SPDX-License-Identifier: Apache-2.0
#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    # Pinned to the exact extension-ci-tools commit checked out in the `extension-ci-tools`
    # submodule (9c58e2d, contained in `main` and in the `v2.0-cyanoptera` release branch).
    # extension-ci-tools has no `v2.0.0` tag yet; once it does, pin both refs below to it (or to
    # its commit SHA). Keep this SHA, `ci_tools_version`, and the submodule in sync (see upgrade.sh).
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@9c58e2d84a763d6b050a41157c82e98e55f5a163
    with:
      duckdb_version: v2.0.0
      ci_tools_version: 9c58e2d84a763d6b050a41157c82e98e55f5a163
      extension_name: bolt
      extra_toolchains: rust;python3
      # - linux_amd64_musl, windows_amd64_rtools, windows_amd64_mingw: not supported by Rust C API
      #   extensions (the upstream Rust extension template excludes them as well).
      # - wasm_*: the Makefile links the C API v2 entrypoint (W1-E-002), and on wasm the runtime
      #   runs every request inline on the caller's thread (no worker thread), but no wasm build
      #   has been loaded in DuckDB-Wasm yet. Re-enable once one has.
      exclude_archs: 'linux_amd64_musl;windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
