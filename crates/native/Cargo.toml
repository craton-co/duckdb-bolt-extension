# SPDX-License-Identifier: Apache-2.0

[package]
name = "duckdb-bolt-extension"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
# Loaded by DuckDB via `LOAD`; nothing depends on it through Cargo. Only duckdb-bolt-core is published.
publish = false

[features]
default = []
cuda-stub = ["duckdb_bolt_core/cuda-stub"]

[lib]
name = "bolt"
crate-type = ["cdylib"]

[dependencies]
duckdb-neo = { workspace = true, features = ["build-extension"] }
duckdb-loadable-macros.workspace = true
duckdb_bolt_core.workspace = true

